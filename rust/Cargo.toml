[workspace]
members = ["crates/app-proxy-core", "crates/app-proxy-windows", "crates/app-proxy-app", "crates/app-proxy-setup"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "process", "signal"] }
app-proxy-core = { path = "crates/app-proxy-core" }
app-proxy-windows = { path = "crates/app-proxy-windows" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
# The store and the engine state sit behind std mutexes. Holding one of those
# guards across an await could deadlock the two-worker runtime.
await_holding_lock = "deny"
