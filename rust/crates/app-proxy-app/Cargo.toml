[package]
name = "app-proxy-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tokio.workspace = true
app-proxy-core.workspace = true
app-proxy-windows.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tempfile.workspace = true
uuid.workspace = true
thiserror.workspace = true
sha2 = "0.10"
base64 = "0.22"
percent-encoding = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
async-compression = { version = "0.4", features = ["tokio", "gzip", "brotli", "zlib", "zstd"] }

[dev-dependencies]
flate2 = "1"
app-proxy-windows = { workspace = true, features = ["test-support"] }
rcgen = "0.14.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[[bin]]
name = "app-proxy"
path = "src/bin/app-proxy.rs"

[[bin]]
name = "app-proxy-host"
path = "src/bin/app-proxy-host.rs"

[lints]
workspace = true
