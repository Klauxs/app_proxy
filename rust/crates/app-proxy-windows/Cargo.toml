[package]
name = "app-proxy-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
app-proxy-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile.workspace = true
uuid.workspace = true
tokio.workspace = true
sha2 = "0.10"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
    "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx",
    "Win32_System_Threading", "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp", "Win32_System_Time",
    "Win32_System_RemoteDesktop", "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Pipes",
    "Win32_UI_Shell", "Win32_System_Com",
    "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock",
] }
windows = { version = "0.62", features = ["Win32_System_Wmi", "Win32_System_Com", "Win32_System_Rpc", "Win32_System_Variant", "Win32_System_Ole"] }

[lints]
workspace = true
